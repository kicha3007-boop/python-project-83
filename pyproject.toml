[project]
name = "hexlet-code"
version = "0.1.0"
description = "Page Analyzer: checks websites for SEO suitability"
authors = [{ name = "Kichigin Sergey", email = "kicha3007@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "flask>=3.1.0",
    "gunicorn>=23.0.0",
    "psycopg[binary]>=3.2.3",
    "python-dotenv>=1.0.1",
    "requests>=2.32.3",
    "validators>=0.34.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["page_analyzer"]
